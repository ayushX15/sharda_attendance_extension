<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="styles/can-leave.css">

      <tr>
        <td>CSE103</td>

      <tr>
        <td>CSE104</td>

      </tr>

  </table>

  <!-- Inject the extension script -->
  <script src="content-scripts/inject-can-leave.js"></script>
</body>
</html>
